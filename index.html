    // Fonksyon pou jwe vwa a lè w klike sou yon matyè
    function playWelcomeVoice(userName) {
        if ('speechSynthesis' in window) {
            let message = `Bienvenue ${userName} dans le quiz Mocenick.`;
            let speech = new SpeechSynthesisUtterance(message);
            speech.lang = 'fr-FR'; // Lang franse
            speech.rate = 1.0; // Vitès vwa a
            window.speechSynthesis.speak(speech);
        }
    }

    function startQuiz(category) {
        const nameInput = document.getElementById("username").value.trim();
        if (!nameInput) {
            alert("Tanpri antre non ou anvan ou kòmanse!");
            return;
        }
        currentUser.name = nameInput;
        currentUser.level = document.getElementById("user-level").value;
        currentUser.category = category;
        currentUser.score = 0;
        score = 0;
        currentQuestionIndex = 0;

        // Fè vwa a pale lè l ap antre nan quiz la
        playWelcomeVoice(currentUser.name);

        activeQuestions = dbQuestions[category] || [];

        document.getElementById("category-display").innerText = `Domèn: ${category}`;
        document.getElementById("home-screen").classList.remove("active");
        document.getElementById("game-screen").classList.add("active");
        loadQuestion();
    }

    function loadQuestion() {
        if (currentQuestionIndex >= activeQuestions.length) {
            endGame();
            return;
        }
        let qData = activeQuestions[currentQuestionIndex];
        document.getElementById("progress-display").innerText = `Kesyon ${currentQuestionIndex + 1} / ${activeQuestions.length}`;
        document.getElementById("question-title").innerText = qData.q;
        
        let optContainer = document.getElementById("options-container");
        optContainer.innerHTML = "";

        qData.options.forEach((opt, index) => {
            let btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerHTML = opt; 
            btn.onclick = () => checkAnswer(index, qData.answer, btn);
            optContainer.appendChild(btn);
        });

        document.getElementById("next-btn").style.display = "none";
    }

    function checkAnswer(selected, correct, buttonElement) {
        const optionsButtons = document.querySelectorAll('.option-btn');
        optionsButtons.forEach(btn => btn.disabled = true);

        if (selected === correct) {
            buttonElement.classList.add('correct');
            score += 10;
        } else {
            buttonElement.classList.add('incorrect');
            optionsButtons[correct].classList.add('correct');
        }

        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        currentQuestionIndex++;
        loadQuestion();
    }

    function endGame() {
        currentUser.score = score;
        document.getElementById("game-screen").classList.remove("active");
        document.getElementById("result-screen").classList.add("active");
        document.getElementById("final-score").innerText = `Pwen ou: ${score} / ${activeQuestions.length * 10}`;

        let leaderboard = JSON.parse(localStorage.getItem("mocenick_scores") || "[]");
        leaderboard.push(currentUser);
        localStorage.setItem("mocenick_scores", JSON.stringify(leaderboard));

        sendDataToGoogleSheet(currentUser);
    }

    function sendDataToGoogleSheet(data) {
        if (GOOGLE_SHEET_URL === "APOTE_GOOGLE_APPS_SCRIPT_URL_IS_LA") return;
        
        fetch(GOOGLE_SHEET_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                nom: data.name,
                nivo: data.level,
                pwen: data.score,
                domèn: data.category
            })
        }).then(() => {
            console.log("Done yo voye nan Google Sheet avèk siksè!");
        }).catch(err => {
            console.error("Erè pandan y ap voye done yo:", err);
        });
    }
