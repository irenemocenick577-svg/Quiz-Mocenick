<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Mocenick PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #ec4899;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg-dark); color: var(--text-color); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 600px; background: var(--card-bg); border-radius: 16px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { text-align: center; margin-bottom: 20px; color: var(--secondary); font-size: 2rem; }
        .screen { display: none; }
        .screen.active { display: block; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 1rem; }
        button { width: 100%; padding: 12px; margin-top: 15px; border: none; border-radius: 8px; background: var(--primary); color: white; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s; }
        button:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-whatsapp { background: #25d366; margin-top: 10px; display: inline-block; text-align: center; text-decoration: none; color: white; padding: 12px; border-radius: 8px; font-weight: bold; }
        .option-btn { background: #334155; margin: 8px 0; text-align: left; }
        .option-btn:hover { background: #475569; }
        .score-board { text-align: center; font-size: 1.5rem; margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>Quiz Mocenick PRO</h1>

    <!-- EKRAN AKÈY & PWOFIL -->
    <div id="home-screen" class="screen active">
        <h3>Byenveni nan Mòd Pwofil ou</h3>
        <input type="text" id="username" placeholder="Antre non ou (pa egz. Irene Mocenick)">
        <select id="user-level">
            <option value="9e Fondamantal">9e Année Fondamentale</option>
            <option value="Economie / Inivèsite">Économie / Université</option>
            <option value="Génie Informatique">Génie Informatique</option>
        </select>
        <label style="margin-top:15px; display:block;">Chwazi Mòd Jwèt:</label>
        <button onclick="startGame('classique')">Matières Classiques</button>
        <button onclick="startGame('laisser')" style="background: var(--secondary);">À prendre ou à laisser</button>
        
        <a href="https://wa.me/50933270330" target="_blank" class="btn-whatsapp">Kontakte Sèvis Kliyan (WhatsApp)</a>
    </div>

    <!-- EKRAN JWÈT -->
    <div id="game-screen" class="screen">
        <h3 id="question-title" style="margin-bottom: 15px;">Kesyon an ap parèt...</h3>
        <div id="options-container"></div>
        <p id="timer" style="text-align: right; margin-top: 10px; color: #facc15;"></p>
    </div>

    <!-- EKRAN REZILTA -->
    <div id="result-screen" class="screen">
        <h2>Jwèt la fini!</h2>
        <div class="score-board" id="final-score">Pwen ou: 0</div>
        <button onclick="location.reload()">Jwe Ankò</button>
        <a href="https://wa.me/50933270330" target="_blank" class="btn-whatsapp">Voye Rezilta sou WhatsApp</a>
    </div>
</div>

<script>
    // METE URL GOOGLE APPS SCRIPT OU A LA A:
    const GOOGLE_SHEET_URL = "APOTE_GOOGLE_APPS_SCRIPT_URL_IS_LA";

    let currentUser = { name: "", level: "", score: 0, mode: "" };
    let currentQuestionIndex = 0;
    let score = 0;

    const questions = [
        { q: "Ki kapital peyi Ayiti?", options: ["Pòtoprens", "Kap Ayisyen", "Fort-Liberté", "Gonayiv"], correct: 0 },
        { q: "Nan ki depatman vil Fort-Liberté ye?", options: ["Nò", "Nòdès", "Artibonite", "Nòdwès"], correct: 1 },
        { q: "Ki espesyalite etid Irene Mocenick gen rapò avè l?", options: ["Medsin", "Économie & Génie Informatique", "Agronomi", "Dwa"], correct: 1 }
    ];

    function startGame(mode) {
        const nameInput = document.getElementById("username").value.trim();
        if (!nameInput) {
            alert("Tanpri antre non ou anvan ou kòmanse!");
            return;
        }
        currentUser.name = nameInput;
        currentUser.level = document.getElementById("user-level").value;
        currentUser.mode = mode;
        currentUser.score = 0;
        score = 0;
        currentQuestionIndex = 0;

        document.getElementById("home-screen").classList.remove("active");
        document.getElementById("game-screen").classList.add("active");
        loadQuestion();
    }

    function loadQuestion() {
        if (currentQuestionIndex >= questions.length) {
            endGame();
            return;
        }
        let qData = questions[currentQuestionIndex];
        document.getElementById("question-title").innerText = `Kesyon ${currentQuestionIndex + 1}: ${qData.q}`;
        let optContainer = document.getElementById("options-container");
        optContainer.innerHTML = "";

        qData.options.forEach((opt, index) => {
            let btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index, qData.correct);
            optContainer.appendChild(btn);
        });
    }

    function checkAnswer(selected, correct) {
        if (selected === correct) {
            score += 10;
        }
        currentQuestionIndex++;
        loadQuestion();
    }

    function endGame() {
        currentUser.score = score;
        document.getElementById("game-screen").classList.remove("active");
        document.getElementById("result-screen").classList.add("active");
        document.getElementById("final-score").innerText = `Pwen ou: ${score} / ${questions.length * 10}`;

        // Sovve sou localStorage tou
        let leaderboard = JSON.parse(localStorage.getItem("mocenick_scores") || "[]");
        leaderboard.push(currentUser);
        localStorage.setItem("mocenick_scores", JSON.stringify(leaderboard));

        // Voye done yo nan Google Sheets otomatikman
        sendDataToGoogleSheet(currentUser);
    }

    function sendDataToGoogleSheet(data) {
        if (GOOGLE_SHEET_URL === "APOTE_GOOGLE_APPS_SCRIPT_URL_IS_LA") return;
        
        fetch(GOOGLE_SHEET_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                nom: data.name,
                nivo: data.level,
                pwen: data.score,
                mod: data.mode
            })
        }).then(() => {
            console.log("Done yo voye nan Google Sheet avèk siksè!");
        }).catch(err => {
            console.error("Erè pandan y ap voye done yo:", err);
        });
    }
</script>

</body>
</html>
