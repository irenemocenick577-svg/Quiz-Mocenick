<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Mocenick - Ultime</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --danger-color: #f85149;
            --success-color: #238636;
            --border-color: #30363d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .menu-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .menu-btn:hover {
            background-color: #30363d;
        }

        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        h1 {
            color: var(--accent-color);
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #8b949e;
            margin-bottom: 1.5rem;
        }

        .btn {
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
            transition: background 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .stats-box {
            background: #21262d;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1.5rem;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--accent-color);
        }

        .hidden {
            display: none !important;
        }

        .question-text {
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        .option-btn {
            background-color: #21262d;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.75rem;
            border-radius: 6px;
            width: 100%;
            text-align: left;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .option-btn:hover {
            background-color: #30363d;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Quiz Mocenick</div>
        <button class="menu-btn" onclick="openLeaderboard()">Klasman Global</button>
    </header>

    <div class="main-container">
        <div class="container">
            <h1>Quiz Mocenick</h1>
            <p class="subtitle">Mòn an, Tès ak Klasman Global</p>

            <!-- Ekran Akèy (Fòk li parèt an premye) -->
            <div id="welcome-screen">
                <p id="welcome-msg" style="text-align: center; margin-bottom: 1rem;">Byenveni! Tanpri antre non ou pou w kòmanse jwe epi antre nan klasman an.</p>
                <button class="btn" onclick="askUsername()">Kòmanse Jwe</button>
                
                <div class="stats-box">
                    <h3>Total Vizitè & Jwè</h3>
                    <p id="visitor-count">Chaje estatistik yo...</p>
                </div>
            </div>

            <!-- Ekran Jwèt la -->
            <div id="quiz-screen" class="hidden">
                <p id="question-counter" style="color: #8b949e; font-size: 0.85rem;"></p>
                <p class="question-text" id="question-text"></p>
                <div id="options-container"></div>
            </div>

            <!-- Ekran Rezilta & Klasman -->
            <div id="result-screen" class="hidden">
                <h2>Partie Fini!</h2>
                <p id="final-score-text" style="font-size: 1.2rem; text-align: center; margin: 1rem 0;"></p>
                
                <div class="stats-box" style="text-align: left;">
                    <h3 style="text-align: center; color: var(--accent-color);">Klasman Global</h3>
                    <table id="leaderboard-table">
                        <thead>
                            <tr>
                                <th>Non</th>
                                <th>Score</th>
                                <th>Nivo</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-body">
                            <tr><td colspan="3" style="text-align: center;">Chaje klasman an...</td></tr>
                        </tbody>
                    </table>
                </div>

                <button class="btn" onclick="location.reload()">Jwe Ankò</button>
            </div>
        </div>
    </div>

    <!-- Audio pou Ti Son -->
    <audio id="click-sound" src="https://www.myinstants.com/media/sounds/click_1.mp3"></audio>
    <audio id="success-sound" src="https://www.myinstants.com/media/sounds/success-1-6287.mp3"></audio>

<script>
    const API_URL = "https://sheetdb.io/api/v1/0f9hmos4ofob1";
    
    let playerName = localStorage.getItem("mocenick_quiz_user") || "";
    let currentQuestionIndex = 0;
    let score = 0;

    const questions = [
        {
            q: "Kisa ki kapital peyi Ayiti?",
            options: ["Cap-Haïtien", "Pòtoprens", "Les Cayes", "Gonaïves"],
            answer: 1
        },
        {
            q: "Nan ki ane Ayiti te vin endepandan?",
            options: ["1804", "1802", "1820", "1789"],
            answer: 0
        },
        {
            q: "Ki pi gwo domèn etid Irene Mocenick?",
            options: ["Medsin", "Dwa", "Ekonomi ak Génie Informatique", "Agronomi"],
            answer: 2
        },
        {
            q: "Ki vil kote w ap viv la?",
            options: ["Pòtoprens", "Fort-Liberté", "St. Domingue", "Milot"],
            answer: 1
        }
    ];

    window.onload = function() {
        fetchVisitorStats();
        // Asire w ke ekran akèy la parèt lè paj la chaje
        document.getElementById("welcome-screen").classList.remove("hidden");
        document.getElementById("quiz-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.add("hidden");

        if (playerName) {
            document.getElementById("welcome-msg").innerText = `Byenveni tounen, ${playerName}! Klike anba a pou w jwe.`;
        }
    };

    function playSound(type) {
        let sound = document.getElementById(type === 'success' ? 'success-sound' : 'click-sound');
        if (sound) {
            sound.currentTime = 0;
            sound.play().catch(e => console.log("Son an pa jwe otomatikman"));
        }
    }

    function askUsername() {
        playSound('click');
        let nameInput = prompt("Tanpri antre non ou oswa ti non ou:", playerName);
        if (nameInput && nameInput.trim() !== "") {
            playerName = nameInput.trim();
            localStorage.setItem("mocenick_quiz_user", playerName);
            startQuiz();
        } else {
            alert("Ou dwe antre yon non pou w ka jwe!");
        }
    }

    function startQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        document.getElementById("welcome-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.add("hidden");
        document.getElementById("quiz-screen").classList.remove("hidden");
        loadQuestion();
    }

    function loadQuestion() {
        if (currentQuestionIndex >= questions.length) {
            endQuiz();
            return;
        }

        let q = questions[currentQuestionIndex];
        document.getElementById("question-counter").innerText = `Kesyon ${currentQuestionIndex + 1} sou ${questions.length}`;
        document.getElementById("question-text").innerText = q.q;

        let optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";

        q.options.forEach((opt, index) => {
            let btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => {
                playSound('click');
                checkAnswer(index);
            };
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedIndex) {
        let q = questions[currentQuestionIndex];
        if (selectedIndex === q.answer) {
            score += 10;
        }
        currentQuestionIndex++;
        loadQuestion();
    }

    function endQuiz() {
        playSound('success');
        document.getElementById("quiz-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.remove("hidden");
        document.getElementById("final-score-text").innerText = `${playerName}, ou fè ${score} pwen!`;

        let data = {
            data: {
                nom: playerName,
                score: score,
                niveau: "Nivo 1"
            }
        };

        fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(() => fetchLeaderboard())
        .catch(() => fetchLeaderboard());
    }

    function fetchVisitorStats() {
        fetch(API_URL)
        .then(response => response.json())
        .then(data => {
            document.getElementById("visitor-count").innerText = `Total moun ki jwe: ${data.length} jwè`;
        })
        .catch(() => {
            document.getElementById("visitor-count").innerText = "Estatistik disponib byento.";
        });
    }

    function fetchLeaderboard() {
        fetch(API_URL)
        .then(response => response.json())
        .then(data => {
            let tbody = document.getElementById("leaderboard-body");
            tbody.innerHTML = "";
            data.sort((a, b) => parseInt(b.score) - parseInt(a.score));
            data.forEach(row => {
                let tr = document.createElement("tr");
                tr.innerHTML = `<td>${row.nom || 'Enkoni'}</td><td>${row.score || 0}</td><td>${row.niveau || 'N/A'}</td>`;
                tbody.appendChild(tr);
            });
        })
        .catch(() => {
            document.getElementById("leaderboard-body").innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--danger-color);">Erè pou chaje klasman an.</td></tr>`;
        });
    }

    function openLeaderboard() {
        playSound('click');
        fetchLeaderboard();
        document.getElementById("welcome-screen").classList.add("hidden");
        document.getElementById("quiz-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.remove("hidden");
        document.getElementById("final-score-text").innerText = "Men klasman aktyèl tout jwè yo:";
    }
</script>

</body>
</html>
